<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>科技坦克 · 绘制 Demo</title>
<style>
  :root{ --bg:#0a0e1a; --line:#11213a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:#00e5ff;
    font-family:"Consolas","Microsoft YaHei",monospace; overflow:hidden; }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; border:1px solid #00e5ff55; box-shadow:0 0 40px #00e5ff22; }
  #hud{ position:absolute; top:14px; left:18px; line-height:1.6; font-size:13px; color:#a8c8ff; pointer-events:none; }
  #hud b{ color:#00e5ff; font-weight:normal; }
  #hud .k{ color:#ffff8f; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="hud">
    <b>科技坦克 · 绘制 Demo</b>（绘制逻辑来自 js/tank.js）<br/>
    <span class="k">WASD</span> 移动 P1 · <span class="k">F</span> 开火 — 其余角色自动巡逻<br/>
    青=P1 / 品红=P2 / 绿=P3 / 橙=AI(BOSS)
  </div>
</div>

<script>
/* ===== 内联 TankRender（与 js/tank.js 同源，demo 自包含） ===== */
(function (global) {
  "use strict";
  function hexToRgb(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function lighten(hex, amt) {
    const { r, g, b } = hexToRgb(hex);
    const f = (c) => Math.min(255, Math.round(c + (255 - c) * amt));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function darken(hex, amt) {
    const { r, g, b } = hexToRgb(hex);
    const f = (c) => Math.round(c * (1 - amt));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function ellipse(ctx, x, y, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerpAngle(a, b, t) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }
  function drawTrack(ctx, x, y, offset, color) {
    ctx.save();
    ctx.translate(x, y);
    roundRect(ctx, -4.5, -19, 9, 38, 4.5);
    ctx.fillStyle = '#0a0f18'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    const m = offset % 6;
    for (let d = -17 + m; d < 19; d += 6) {
      ctx.beginPath(); ctx.moveTo(-4.5, d); ctx.lineTo(4.5, d); ctx.stroke();
    }
    ctx.restore();
  }
  function drawTank(ctx, tank) {
    const phase = tank.phase || 0;
    ctx.save();
    ctx.translate(tank.x, tank.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ellipse(ctx, 0, 4, 21, 18);
    drawTrack(ctx, -16, 0, tank.treadOffset, tank.color);
    drawTrack(ctx, 16, 0, tank.treadOffset, tank.color);
    const hull = ctx.createLinearGradient(0, -17, 0, 17);
    hull.addColorStop(0, lighten(tank.color, 0.25));
    hull.addColorStop(1, darken(tank.color, 0.45));
    roundRect(ctx, -13, -17, 26, 34, 6);
    ctx.fillStyle = hull; ctx.fill();
    ctx.shadowColor = tank.color; ctx.shadowBlur = 8;
    ctx.strokeStyle = tank.color; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = lighten(tank.color, 0.5); ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-9, -15); ctx.lineTo(9, -15);
    ctx.moveTo(-7, -11); ctx.lineTo(7, -11);
    ctx.stroke();
    ctx.save();
    ctx.rotate(tank.angle);
    const recoil = tank.recoil || 0;
    roundRect(ctx, -2, -18 - recoil, 4, 18, 2);
    ctx.fillStyle = '#0d1420'; ctx.fill();
    ctx.strokeStyle = tank.color; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = lighten(tank.color, 0.6);
    ctx.fillRect(-2, -20 - recoil, 4, 3);
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fillStyle = tank.color; ctx.fill();
    ctx.strokeStyle = '#0d1420'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.005 + phase);
    ctx.shadowColor = tank.color; ctx.shadowBlur = 8 + 10 * pulse;
    ctx.beginPath(); ctx.arc(0, 0, 3 + 0.8 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    if (tank.flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = tank.flash;
      roundRect(ctx, -13, -17, 26, 34, 6);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  global.TankRender = { hexToRgb, lighten, darken, roundRect, ellipse, clamp, lerpAngle, drawTrack, drawTank };
})(window);
const { drawTank, clamp, lerpAngle } = window.TankRender;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* ============ 角色与动画 ============ */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(['KeyW','KeyA','KeyS','KeyD','KeyF','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

function makeTank(x, y, angle, color, phase){
  return { x, y, angle, color, phase, speed:0, treadOffset:0, recoil:0, flash:0, fireTimer:0 };
}

const p1  = makeTank(300, 360, 0, '#00e5ff', 0);
const p2  = makeTank(980, 200, 0, '#ff2ec8', 1.2);
const p3  = makeTank(320, 560, 0, '#3cff8f', 2.4);
const ai  = makeTank(980, 520, 0, '#ff9f00', 3.6);
const tanks = [p1, p2, p3, ai];

// 自动巡逻路径参数（对应 P2 / P3 / AI）
const patrols = [
  {cx:980, cy:200, r:180, w:0.6, ph:0.0},
  {cx:320, cy:560, r:150, w:0.8, ph:2.0},
  {cx:980, cy:520, r:220, w:0.5, ph:4.0},
];

/* ============ 主循环 ============ */
const SPEED = 170;
let last = performance.now();

function update(dt){
  // P1：玩家控制
  let dx = 0, dy = 0;
  if(keys['KeyW']) dy -= 1;
  if(keys['KeyS']) dy += 1;
  if(keys['KeyA']) dx -= 1;
  if(keys['KeyD']) dx += 1;
  if(dx || dy){
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    p1.x += dx * SPEED * dt;
    p1.y += dy * SPEED * dt;
    p1.angle = lerpAngle(p1.angle, Math.atan2(dy, dx), dt * 8);
    p1.speed = SPEED;
  } else {
    p1.speed = 0;
  }
  p1.x = clamp(p1.x, 40, 1240);
  p1.y = clamp(p1.y, 40, 680);
  if(keys['KeyF'] && p1.fireTimer <= 0){
    p1.recoil = 3; p1.fireTimer = 0.2;
  }

  // 自动巡逻角色
  const now = performance.now() * 0.001;
  patrols.forEach((p, i) => {
    const t = tanks[i + 1];
    const ang = now * p.w + p.ph;
    const nx = p.cx + Math.cos(ang) * p.r;
    const ny = p.cy + Math.sin(ang) * p.r;
    const vx = nx - t.x, vy = ny - t.y;
    t.angle = lerpAngle(t.angle, Math.atan2(vy, vx), dt * 4);
    t.x += vx * dt * 0.8;
    t.y += vy * dt * 0.8;
    t.speed = Math.hypot(vx, vy) * 0.8;
    t.fireTimer -= dt;
    if(t.fireTimer <= 0){ t.recoil = 3; t.fireTimer = 1.4 + i * 0.3; }
  });

  // 通用衰减
  tanks.forEach(t => {
    t.recoil = Math.max(0, t.recoil - dt * 30);
    t.treadOffset += t.speed * dt * 0.5;
    t.flash = Math.max(0, (t.flash || 0) - dt * 4);
    if(t.fireTimer !== undefined) t.fireTimer -= dt;
  });
}

/* ============ 背景与渲染 ============ */
function drawGrid(){
  ctx.clearRect(0, 0, 1280, 720);
  ctx.strokeStyle = '#0e1a30';
  ctx.lineWidth = 1;
  for(let x = 0; x <= 1280; x += 40){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 720); ctx.stroke();
  }
  for(let y = 0; y <= 720; y += 40){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
  }
  const g = ctx.createRadialGradient(640, 360, 60, 640, 360, 700);
  g.addColorStop(0, 'rgba(0,229,255,0.05)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1280, 720);
}

function render(){
  drawGrid();
  tanks.forEach(t => drawTank(ctx, t));
}

function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
