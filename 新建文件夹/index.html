<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>温俊诚 · 个人简历</title>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 浅色主题 */
            --bg-body: #f4f6fb;
            --bg-card: #ffffff;
            --bg-nav: rgba(255, 255, 255, 0.82);
            --bg-hero: linear-gradient(145deg, #1b2a4a 0%, #2c3e7a 100%);
            --bg-tab-active: #2c3e7a;
            --bg-tab-hover: #eef2f7;
            --text-primary: #1a1a2e;
            --text-secondary: #3d3d5c;
            --text-muted: #7a7a9a;
            --text-light: #f0f4ff;
            --text-hero: #ffffff;
            --accent: #f39c12;
            --accent-light: #f7c948;
            --border: #e2e8f0;
            --shadow: 0 8px 32px rgba(26, 26, 46, 0.08);
            --shadow-hover: 0 16px 48px rgba(26, 26, 46, 0.16);
            --radius: 18px;
            --radius-sm: 10px;
            --transition: 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --max-width: 1100px;
            --nav-height: 68px;
        }

        /* 深色主题 */
        [data-theme="dark"] {
            --bg-body: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-nav: rgba(15, 15, 26, 0.88);
            --bg-hero: linear-gradient(145deg, #0a0a18 0%, #1b2a4a 100%);
            --bg-tab-active: #4a6fa5;
            --bg-tab-hover: #2a2a44;
            --text-primary: #e8ecf4;
            --text-secondary: #b8bcd4;
            --text-muted: #7a7e9a;
            --text-light: #e8ecf4;
            --text-hero: #ffffff;
            --border: #2a2a44;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.6);
        }

        /* ===== 基础 ===== */
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
            padding-top: var(--nav-height);
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            color: var(--accent-light);
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tab-active);
            border-radius: 8px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: var(--bg-nav);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            transition: background 0.3s, border-color 0.3s;
        }

        .navbar .brand {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .navbar .brand .accent-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 4px;
        }

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .navbar .nav-links a {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 30px;
            transition: background 0.2s, color 0.2s;
            letter-spacing: 0.3px;
        }
        .navbar .nav-links a:hover {
            background: var(--bg-tab-hover);
            color: var(--text-primary);
        }

        .navbar .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar .actions button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 6px 8px;
            border-radius: 30px;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
        }
        .navbar .actions button:hover {
            background: var(--bg-tab-hover);
            color: var(--text-primary);
            transform: scale(1.05);
        }
        .navbar .actions button.print-btn {
            font-size: 1.1rem;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 20px 24px 40px;
        }

        /* ===== Hero ===== */
        .hero {
            background: var(--bg-hero);
            border-radius: var(--radius);
            padding: 48px 44px 44px;
            color: var(--text-hero);
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(27, 42, 74, 0.25);
            transition: background 0.4s;
        }
        .hero::after {
            content: "";
            position: absolute;
            right: -60px;
            top: -60px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.13) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .hero .hero-inner {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            align-items: flex-start;
            justify-content: space-between;
        }
        .hero .hero-main {
            flex: 2 1 320px;
        }
        .hero .hero-main h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .hero .hero-main .subhead {
            font-size: 1.1rem;
            opacity: 0.8;
            font-weight: 400;
            margin-bottom: 14px;
        }
        .hero .hero-main p {
            font-size: 0.98rem;
            opacity: 0.92;
            max-width: 600px;
            line-height: 1.7;
            margin-bottom: 18px;
        }

        .hero .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .hero .hero-tags span {
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(4px);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .hero .hero-contact {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .hero .hero-contact .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: #1a1a2e;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 9px 22px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(243, 156, 18, 0.3);
        }
        .hero .hero-contact .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(243, 156, 18, 0.4);
        }
        .hero .hero-contact .btn-outline {
            background: transparent;
            color: var(--text-hero);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
            font-weight: 500;
        }
        .hero .hero-contact .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: none;
        }

        .hero .hero-stats {
            flex: 1 1 200px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px 32px;
            padding-top: 6px;
        }
        .hero .hero-stats .stat-item {
            display: flex;
            flex-direction: column;
        }
        .hero .hero-stats .stat-item .num {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-light);
            line-height: 1.2;
        }
        .hero .hero-stats .stat-item .label {
            font-size: 0.75rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== 卡片通用 ===== */
        .section {
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .section-title .title-line {
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, var(--accent), transparent);
            opacity: 0.3;
        }

        .card-grid {
            display: grid;
            gap: 20px;
        }
        .card-grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        .card-grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 26px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.25s, background 0.3s, border-color 0.3s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .card .card-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .card .card-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }
        .card .card-sub .tag {
            background: var(--bg-tab-hover);
            padding: 0 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }
        .card ul {
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
        }
        .card ul li {
            padding: 4px 0 4px 20px;
            position: relative;
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .card ul li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
        }

        /* ===== Tabs ===== */
        .tabs-wrap {
            margin-top: 6px;
        }
        .tabs-nav {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border);
            padding-bottom: 2px;
            margin-bottom: 20px;
        }
        .tabs-nav button {
            background: none;
            border: none;
            padding: 10px 22px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            position: relative;
            font-family: var(--font);
        }
        .tabs-nav button:hover {
            background: var(--bg-tab-hover);
            color: var(--text-primary);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--bg-tab-active);
            background: transparent;
        }
        .tabs-nav button[aria-selected="true"]::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--bg-tab-active);
            border-radius: 4px 4px 0 0;
            transition: left 0.25s, right 0.25s;
        }
        .tabs-nav button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .tab-panel {
            display: none;
            animation: fadeUp 0.28s ease;
        }
        .tab-panel[aria-hidden="false"] {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 技能矩阵 ===== */
        .skill-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .skill-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .skill-row .skill-label {
            flex: 0 0 100px;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .skill-row .skill-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .skill-row .skill-bar .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            width: 0%;
            transition: width 0.6s ease;
        }
        .skill-row .skill-pct {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 36px;
            text-align: right;
        }

        .badge-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .badge-cloud .badge {
            background: var(--bg-tab-hover);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            transition: background 0.2s, transform 0.15s;
        }
        .badge-cloud .badge:hover {
            background: var(--accent);
            color: #1a1a2e;
            transform: translateY(-2px);
        }

        /* ===== 教育 & 证书 ===== */
        .edu-item {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .edu-item:last-child {
            border-bottom: none;
        }
        .edu-item .edu-name {
            font-weight: 600;
            font-size: 1rem;
            flex: 1 1 180px;
        }
        .edu-item .edu-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .edu-item .edu-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            flex: 1 1 100%;
            padding-left: 4px;
        }

        /* ===== 页脚 ===== */
        .footer {
            margin-top: 48px;
            padding: 24px 0 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .footer .update {
            opacity: 0.7;
        }

        /* ===== 返回顶部 ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--bg-tab-active);
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(44, 62, 122, 0.3);
            transition: transform 0.2s, opacity 0.25s, background 0.2s;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.85);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .back-top:hover {
            transform: scale(1.06);
            background: var(--accent);
            color: #1a1a2e;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            bottom: 88px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 2000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .hero {
                padding: 32px 24px 28px;
            }
            .hero .hero-main h1 {
                font-size: 2rem;
            }
            .hero .hero-stats {
                flex: 1 1 100%;
                gap: 12px 28px;
            }
            .navbar .nav-links a {
                font-size: 0.72rem;
                padding: 4px 10px;
            }
            .navbar {
                padding: 0 16px;
            }
            .container {
                padding: 12px 14px 32px;
            }
        }

        @media (max-width: 540px) {
            :root {
                --nav-height: 60px;
            }
            .navbar .brand {
                font-size: 1rem;
            }
            .navbar .nav-links a {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
            .navbar .actions button {
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }
            .hero .hero-main h1 {
                font-size: 1.6rem;
            }
            .hero .hero-contact .btn {
                font-size: 0.8rem;
                padding: 7px 16px;
            }
            .card {
                padding: 18px 16px;
            }
            .tabs-nav button {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .skill-row .skill-label {
                flex: 0 0 70px;
                font-size: 0.75rem;
            }
            .footer {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }

        /* ===== 打印样式 ===== */
        @media print {
            body {
                background: #fff !important;
                color: #1a1a2e !important;
                padding-top: 0 !important;
            }
            .navbar,
            .back-top,
            .toast,
            .no-print {
                display: none !important;
            }
            .hero {
                background: #1b2a4a !important;
                color: #fff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                box-shadow: none !important;
                border-radius: 8px !important;
            }
            .hero .hero-stats .stat-item .num {
                color: #f7c948 !important;
            }
            .card {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                break-inside: avoid;
                page-break-inside: avoid;
                background: #fff !important;
            }
            .card:hover {
                transform: none !important;
            }
            .tabs-nav button[aria-selected="true"]::after {
                background: #1b2a4a !important;
            }
            .section {
                margin-bottom: 24px !important;
            }
            .badge-cloud .badge {
                border: 1px solid #ccc !important;
                background: #f5f5f5 !important;
                color: #333 !important;
            }
            .skill-row .skill-bar .fill {
                background: #1b2a4a !important;
            }
            .container {
                max-width: 100% !important;
                padding: 12px 20px !important;
            }
            .footer {
                border-top: 1px solid #ccc !important;
            }
            .hero::after {
                display: none !important;
            }
            .tab-panel {
                display: block !important;
                animation: none !important;
            }
            .tabs-nav button {
                display: none !important;
            }
            .tabs-nav button[aria-selected="true"] {
                display: inline-block !important;
                background: transparent !important;
                color: #1a1a2e !important;
            }
            .tabs-nav button[aria-selected="true"]::after {
                display: none !important;
            }
            .tabs-wrap .tab-panel {
                display: block !important;
            }
            .tabs-wrap .tab-panel[aria-hidden="false"] {
                display: block !important;
            }
            .tabs-wrap .tab-panel[aria-hidden="true"] {
                display: block !important;
            }
            /* 打印时显示所有tab内容 */
            .tabs-nav {
                display: none !important;
            }
            .tab-panel {
                display: block !important;
                margin-bottom: 20px;
            }
            .tab-panel .card-grid {
                display: block !important;
            }
            .tab-panel .card-grid .card {
                margin-bottom: 16px;
            }
            .hero .hero-contact .btn {
                background: #f39c12 !important;
                color: #1a1a2e !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .hero .hero-contact .btn-outline {
                background: transparent !important;
                border-color: rgba(255, 255, 255, 0.4) !important;
                color: #fff !important;
            }
        }

        /* ===== prefers-reduced-motion ===== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .card:hover {
                transform: none !important;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .gap-4 {
            gap: 4px;
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar" role="navigation" aria-label="主导航">
        <div class="brand">
            <span class="accent-dot"></span>
            温俊诚
        </div>
        <div class="nav-links">

            function bindTabs(nav, panels, prefix) {
                const buttons = $$('button[role="tab"]', nav);

                function activate(idx) {
                    buttons.forEach((b, i) => {
                        const sel = i === idx;
                        b.setAttribute('aria-selected', sel ? 'true' : 'false');
                        b.setAttribute('tabindex', sel ? '0' : '-1');
                    });
                    panes.forEach((p, i) => {
                        p.setAttribute('aria-hidden', i === idx ? 'false' : 'true');
                    });
                }

                buttons.forEach((btn, idx) => {
                    btn.addEventListener('click', () => activate(idx));
                    btn.addEventListener('keydown', (e) => {
                        const len = buttons.length;
                        let next = idx;
                        if (e.key === 'ArrowRight') { e.preventDefault();
                            next = (idx + 1) % len; } else if (e.key === 'ArrowLeft') { e
                                .preventDefault();
                            next = (idx - 1 + len) % len; } else return;
                        activate(next);
                        buttons[next].focus();
                    });
                });

                // 默认激活第一个
                if (buttons.length) activate(0);
            }

            }

            // ==========================================================
            //  4. 主题切换
            // ==========================================================
            function initTheme() {
                const stored = localStorage.getItem('theme') || 'light';
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = stored === 'dark' || (stored === 'auto' && prefersDark) ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                updateThemeIcon(theme);
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateThemeIcon(next);
            }

            function updateThemeIcon(theme) {
                const icon = document.getElementById('themeIcon');
                if (!icon) return;
                if (theme === 'dark') {
                    icon.innerHTML =
                        '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
                } else {
                    icon.innerHTML =
                        '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
                }
            }

            // ==========================================================
            //  5. 返回顶部
            // ==========================================================
            function initBackTop() {
                const btn = document.getElementById('backTop');
                if (!btn) return;
                let ticking = false;
                window.addEventListener('scroll', () => {
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const scrollY = window.scrollY || window.pageYOffset;
                            btn.classList.toggle('visible', scrollY > 400);
                            ticking = false;
                        });
                        ticking = true;
                    }
                });
                btn.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            // ==========================================================
            //  6. 邮箱复制
            // ==========================================================
            function initCopyEmail() {
                const btn = document.getElementById('copyEmailBtn');
                if (!btn) return;
                btn.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(FULL_EMAIL);
                        showToast('✅ 邮箱已复制：' + FULL_EMAIL);
                    } catch (_) {
                        // fallback
                        const ta = document.createElement('textarea');
                        ta.value = FULL_EMAIL;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        try {
                            document.execCommand('copy');
                            showToast('✅ 邮箱已复制：' + FULL_EMAIL);
                        } catch (_) { showToast('⚠️ 复制失败，请手动复制'); }
                        document.body.removeChild(ta);
                    }
                });
            }

            // ==========================================================
            //  7. 初始化
            // ==========================================================
            function init() {
                renderHeroTags();
                renderHeroStats();
                renderHighlights();
                renderExperiences();
                renderProjects();
                renderSkills();
                renderEducation();
                initTheme();
                initBackTop();
                initCopyEmail();

                // 主题切换
                document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);

                // 监听系统主题变化
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    const stored = localStorage.getItem('theme');
                    if (stored === 'auto' || !stored) {
                        const theme = e.matches ? 'dark' : 'light';
                        document.documentElement.setAttribute('data-theme', theme);
                        updateThemeIcon(theme);
                    }
                });

                console.log('✅ 简历网站加载完成 · 温俊诚');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
