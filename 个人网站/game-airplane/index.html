<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星际战机 · 飞机大战</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="game-container">
    <canvas id="game" width="480" height="720"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-top">
        <div class="hud-box"><span class="label">分数</span><span class="val" id="score">0</span></div>
        <div class="hud-box"><span class="label">波次</span><span class="val" id="wave">1</span></div>
        <div class="hud-box"><span class="label">连击</span><span class="val" id="combo">0</span></div>
        <div class="hud-box"><span class="label">炸弹</span><span class="val" id="bombs">1</span></div>
      </div>
      <div id="hud-bottom">
        <div class="bar-wrap" id="hp-wrap"><div class="bar" id="hp-fill"></div><span class="bar-text" id="hp-text">100</span></div>
        <div class="bar-wrap" id="energy-wrap"><div class="bar" id="energy-fill"></div><span class="bar-text energy-label">大招</span></div>
        <div class="hud-box"><span class="label">火力</span><span class="val" id="power">1</span></div>
      </div>
    </div>

    <!-- Boss warning -->
    <div id="boss-warning" class="hidden">⚠ WARNING ⚠</div>

    <!-- Menu -->
    <div id="menu" class="overlay">
      <h1 class="title">星 际 战 机</h1>
      <p class="subtitle">STELLAR STRIKER</p>
      <div class="mode-row">
        <button class="mode-btn active" data-mode="normal">正常模式</button>
        <button class="mode-btn" data-mode="endless">无尽模式</button>
      </div>
      <div class="diff-row">
        <button class="diff-btn" data-diff="easy">简单</button>
        <button class="diff-btn active" data-diff="normal">普通</button>
        <button class="diff-btn" data-diff="hard">困难</button>
        <button class="diff-btn" data-diff="hell">地狱</button>
      </div>
      <div class="fighter-row">
        <button class="fighter-btn active" data-fighter="default">
          <img src="assets/fighters/fighter_default.svg" alt="默认战机">
          <span>默认</span>
        </button>
        <button class="fighter-btn" data-fighter="blaster">
          <img src="assets/fighters/fighter_blaster.svg" alt="爆破战机">
          <span>爆破</span>
        </button>
        <button class="fighter-btn" data-fighter="lightning">
          <img src="assets/fighters/fighter_lightning.svg" alt="闪电战机">
          <span>闪电</span>
        </button>
        <button class="fighter-btn" data-fighter="guardian">
          <img src="assets/fighters/fighter_guardian.svg" alt="守护战机">
          <span>守护</span>
        </button>
      </div>
      <button id="btn-start" class="btn">开 始 游 戏</button>
      <button id="btn-guide" class="btn-link">操作 &amp; 玩法指引</button>
      <div class="tips">
        <p>移动：方向键 / WASD / 鼠标拖动</p>
        <p>大招：J　炸弹：K 或 空格　暂停：P</p>
      </div>
    </div>

    <!-- 操作指引 -->
    <div id="guide" class="overlay hidden">
      <h1 class="title small">操 作 指 引</h1>
      <div class="guide-body">
        <div class="guide-item"><span class="g-key">移动</span><span>方向键 / WASD / 鼠标拖动</span></div>
        <div class="guide-item"><span class="g-key">射击</span><span>自动开火（拾取火力道具升级弹幕）</span></div>
        <div class="guide-item"><span class="g-key">大招</span><span>J —— 能量满后清屏并短暂无敌</span></div>
        <div class="guide-item"><span class="g-key">炸弹</span><span>K / 空格 —— 清除弹幕并伤害全场</span></div>
        <div class="guide-item"><span class="g-key">暂停</span><span>P 或 Esc</span></div>
      </div>
      <button id="btn-guide-back" class="btn">返 回</button>
    </div>

    <!-- 升级界面 -->
    <div id="upgrade" class="overlay hidden">
      <h1 class="title small">战 机 升 级</h1>
      <p class="subtitle">选择一项强化</p>
      <div class="upgrade-row" id="upgrade-options"></div>
    </div>

    <!-- Pause -->
    <div id="pause" class="overlay hidden">
      <h1 class="title small">已 暂 停</h1>
      <button id="btn-resume" class="btn">继 续</button>
    </div>

    <!-- Game over -->
    <div id="gameover" class="overlay hidden">
      <h1 class="title small">游 戏 结 束</h1>
      <p class="result">得分 <span id="final-score">0</span></p>
      <p class="result">最高 <span id="best-score">0</span></p>
      <button id="btn-restart" class="btn">重 新 开 始</button>
    </div>

    <!-- 通关 / 胜利结算 -->
    <div id="clear" class="overlay hidden">
      <h1 class="title small" id="clear-title">您 已 通 关</h1>
      <p class="subtitle" id="clear-sub">Boss 已被击破</p>
      <p class="result">得分 <span id="clear-score">0</span></p>
      <button id="clear-btn" class="btn">继 续</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/particle.js"></script>
<script src="js/bullet.js"></script>
<script src="js/powerup.js"></script>
<script src="js/enemy.js"></script>
<script src="js/boss.js"></script>
<script src="js/player.js"></script>
<script src="js/background.js"></script>
<script src="js/wave.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
